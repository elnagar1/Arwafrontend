<div style="max-width: 1400px; margin: 0 auto; padding: 20px;" dir="auto">
  
  <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 2px solid var(--border-light); padding-bottom: 15px;">
    <div>
      <h1 style="color: var(--primary-indigo); font-size: 2.2rem; margin: 0;">{{ 'TEXTBOOK.TITLE' | translate }}</h1>
      <p style="color: var(--text-secondary); margin-top: 5px; font-size: 1.1rem; margin-bottom: 15px;">{{ 'TEXTBOOK.SUBTITLE' | translate }}</p>
      
      <!-- Term Selector -->
      <div style="display: flex; gap: 10px;">
        <button (click)="setTerm('part1')" 
                [ngStyle]="{'background': selectedTerm === 'part1' ? 'var(--primary-indigo)' : 'var(--bg-card)', 'color': selectedTerm === 'part1' ? 'white' : 'var(--text-main)'}"
                style="padding: 8px 20px; border-radius: 8px; border: none; font-family: var(--font-sans); font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;">
          {{ 'TEXTBOOK.PART_1' | translate }}
        </button>
        <button (click)="setTerm('part2')" 
                [ngStyle]="{'background': selectedTerm === 'part2' ? 'var(--primary-indigo)' : 'var(--bg-card)', 'color': selectedTerm === 'part2' ? 'white' : 'var(--text-main)'}"
                style="padding: 8px 20px; border-radius: 8px; border: none; font-family: var(--font-sans); font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.3s;">
          {{ 'TEXTBOOK.PART_2' | translate }}
        </button>
      </div>

    </div>
    
    <a [href]="selectedTerm === 'part1' ? '/assets/book.pdf' : '/assets/book2.pdf'" [download]="selectedTerm === 'part1' ? 'كتاب_البرمجة_الجزء_الأول.pdf' : 'كتاب_البرمجة_الجزء_الثاني.pdf'" class="edu-button-outline" style="text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
      <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      {{ 'TEXTBOOK.DOWNLOAD' | translate }}
    </a>
  </div>

  <div class="pdf-container" style="border-radius: 16px; overflow: hidden; border: 1px solid var(--border-light); box-shadow: var(--glass-shadow); height: calc(100vh - 200px); background: var(--bg-card);">
    
    <!-- PDF Viewer embedded -->
    <iframe *ngIf="selectedTerm === 'part1'" src="/assets/book.pdf#view=FitH" width="100%" height="100%" frameborder="0" title="كتاب الوزارة الجزء الأول"></iframe>
    <iframe *ngIf="selectedTerm === 'part2'" src="/assets/book2.pdf#view=FitH" width="100%" height="100%" frameborder="0" title="كتاب الوزارة الجزء الثاني"></iframe>
    
  </div>

</div>
