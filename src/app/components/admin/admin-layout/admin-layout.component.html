<div class="admin-wrapper">
  
  <!-- Mobile Header (Visible only on mobile) -->
  <div class="mobile-admin-header">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 25px; height: 25px; border-radius: 6px; overflow: hidden; display: flex; justify-content: center; align-items: center;">
        <img src="/assets/shafra_logo.jpg" alt="Shafra Tech Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <h2 style="color: var(--primary-blue); font-family: var(--font-mono); font-size: 1.2rem; letter-spacing: 1px; margin: 0;">
        SHAFRA<span style="color: white;">_ADMIN</span>
      </h2>
    </div>
    <button class="admin-menu-toggle" (click)="toggleSidebar()">
      ☰
    </button>
  </div>

  <!-- Admin Sidebar -->
  <aside class="admin-sidebar" [class.open]="isSidebarOpen">
    
    <div class="sidebar-logo" style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 40px;">
      <div style="width: 35px; height: 35px; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);">
        <img src="/assets/shafra_logo.jpg" alt="Shafra Tech Logo" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <h2 style="color: var(--primary-blue); font-family: var(--font-mono); font-size: 1.5rem; letter-spacing: 1px; margin: 0;">
        SHAFRA<span style="color: white;">_ADMIN</span>
      </h2>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/videos" 
         routerLinkActive="active-admin-link"
         (click)="isSidebarOpen = false"
         class="sidebar-link">
        <span>📹</span> إدارة الفيديوهات
      </a>
      <a routerLink="/admin/settings" 
         routerLinkActive="active-admin-link"
         (click)="isSidebarOpen = false"
         class="sidebar-link">
        <span>⚙️</span> الإعدادات العامة
      </a>
      <a routerLink="/admin/courses" 
         class="sidebar-link disabled-link">
        <span>📚</span> إدارة الكورسات (قريباً)
      </a>
    </nav>

    <div style="margin-top: auto;">
      <a routerLink="/" 
         class="sidebar-link back-link">
        <span>🚪</span> العودة للموقع
      </a>
    </div>

  </aside>

  <!-- Overlay for mobile sidebar -->
  <div class="sidebar-overlay" *ngIf="isSidebarOpen" (click)="isSidebarOpen = false"></div>

  <!-- Admin Main Content -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>

</div>
